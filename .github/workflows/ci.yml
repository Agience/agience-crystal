name: ci

# Two jobs, because the two claims this repository makes are tested by different things.
#
# The first is the INSTALL claim: `pip install agience-crystal` gives you the gateway on one
# dependency, and importing it pulls no instrument and no numpy. That has to be checked against a
# real install of the built distribution and nothing else on the path, or it checks nothing.
#
# The second is the suite, and it stands on this repository plus `agience-prism` — the one package
# crystal declares. Nothing above crystal in the DAG is checked out, so a fork can run this.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  # The gateway install, alone. No sibling checkout, no extras — just the wheel and what it declares.
  gateway-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # From an index, not from the checkout: this resolves `agience-prism` for real, which is the
      # step that catches a dependency naming a distribution that does not exist. That defect
      # shipped once here — the line said `agience-prism-py`, which is the REPOSITORY name and not a
      # distribution — and every editable install in the developer workspace hid it.
      - run: pip install .
      # Stated as an allow-list rather than a list of things not to import. A deny-list only ever
      # catches what somebody thought to name, and it goes stale the moment a new package could be
      # reached; this fails on anything outside the base install, including one nobody predicted.
      - name: Importing crystal reaches nothing but the contract
        run: |
          python - <<'PY'
          import sys
          before = set(sys.modules)
          import crystal
          ALLOWED = {"crystal", "prism"}
          reached = sorted({m.split(".")[0] for m in set(sys.modules) - before}
                           - ALLOWED - sys.stdlib_module_names)
          assert not reached, (
              "`import crystal` reached %s. The base install is the contract: the embodiment that "
              "measures is INJECTED by the host at assembly, so a crystal that imports one does not "
              "run on a constrained store." % (reached,))
          print("import crystal: reaches only", sorted(ALLOWED))
          PY
      - name: The ontology extra installs and imports
        run: |
          pip install '.[ontology]'
          python -c "import crystal.ontology.geometry; print('ontology extra: ok')"
      # The wheel ships `crystal` and nothing else. Reads the built artifact, because the defect it
      # holds lived in the distribution and not in any import.
      - run: pip install build pytest
      - run: python -m pytest tests/test_the_wheel_ships_only_crystal.py -q

  # The suite. No token and no bundle root — every checkout below is a PUBLIC repository, and none
  # of them sits above crystal in the DAG, so a fork can run this.
  #
  # It could not before. `test_crystal.py` and `test_embodiment_injection.py` injected the real
  # instrument, and one test read ember's ingest vocabulary, so the job checked out `agience-ember`
  # and `agience-observe` — both private. Once this repository went public its own GITHUB_TOKEN
  # could no longer read them and the job failed at checkout, on a claim about crystal that needed
  # neither repository. Those assertions moved to `agience-ember`, which imports crystal and can
  # make them with the arrow pointing the way the packages already point.
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prism from this organization's repository rather than an index, so the suite runs against
      # the revision beside this one rather than whatever version PyPI served today. It is the one
      # sibling crystal actually declares, and it is public.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agience-prism-py
          path: .siblings/agience-prism-py
      # Mantle, for ONE test file. `tests/test_relation_signature.py` proves crystal's
      # counter-based relation signature against an independent `count(*)` on a real store, and
      # that argument needs the reference implementation — a double is written by the same hand as
      # the thing it audits. Mantle is a SIBLING (neither package declares the other) and it is
      # public, so this needs no token and inverts nothing.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agience-mantle
          path: .siblings/agience-mantle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install './.siblings/agience-prism-py[wire,trust,vector]' ./.siblings/agience-mantle
      # `service` is not optional for the SUITE even though it is optional for the package:
      # `test_dispatcher.py` and the route tests import `crystal.dispatcher`, which imports
      # fastapi at module scope. A developer machine hides this by having fastapi installed for
      # something else; a clean runner does not, which is what caught it.
      - run: pip install -e '.[service,ontology,dev]'
      - name: Run the suite
        env:
          # One thread is the only safe setting in CI: OpenBLAS otherwise faults at exit or hangs.
          OPENBLAS_NUM_THREADS: "1"
        run: python -m pytest -q --timeout=300
